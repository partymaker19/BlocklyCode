# Конфигурация деплоя на Render (https://render.com).
#
# Один Web Service: собирает фронт (app/dist) и поднимает Express-сервер,
# который раздаёт статику + API. Бесплатный тариф даёт URL вида
# https://<service-name>.onrender.com — домен не обязателен.
#
# ВАЖНО перед первым деплоем (Dashboard → Environment):
#   DATA_DIR      — не задавать! На Render файловая система ephemeral:
#                   при каждом перезапуске/деплое данные SQLite обнуляются.
#                   Для продакшена подключить Render Persistent Disk и
#                   указать его путь (например /data) в DATA_DIR.
#   FEEDBACK_TO   — куда слать обратную связь (по умолчанию задана в коде).
#   SMTP_*        — SMTP_HOST/PORT/USER/PASS/FROM для реальной отправки писем;
#                   без них фидбэк копится в DATA_DIR/feedback.json.
#   SESSION секреты не нужны (сессии в SQLite).

services:
  - type: web
    name: blocklycode
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/feedback/types
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      # Render сам выставляет PORT
      - key: FEEDBACK_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
